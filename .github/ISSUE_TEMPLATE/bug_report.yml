name: Bug report
description: Something is broken (a crash, a wrong install, doctor failing)
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `seatbelt doctor`
      render: text
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: seatbelt version, Claude Code version, OS, Python version
    validations: {required: true}
  - type: markdown
    attributes:
      value: Do not paste secrets. seatbelt redacts its audit log, but check anything you paste.
