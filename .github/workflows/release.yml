name: release
# Publishes to PyPI when a GitHub release is published, using PyPI "trusted publishing" (no token is stored).
# One-time setup on pypi.org: add a trusted publisher for this repo, workflow `release.yml`, environment `pypi`.
on:
  release:
    types: [published]
# Until the repository variable PUBLISH_TO_PYPI is set to "true", the job below is skipped (not failed).
jobs:
  publish:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
