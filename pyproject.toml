[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seatbelt-guard"
version = "0.1.5"
description = "A seatbelt for AI coding agents: understands the shell commands they run and blocks or asks before the dangerous ones."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "nikhilrai-tech" }]
keywords = ["ai-agents", "security", "guardrails", "devops", "claude-code", "shell"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nikhilrai-tech/seatbelt-for-AI-agents"
Issues = "https://github.com/nikhilrai-tech/seatbelt-for-AI-agents/issues"
Changelog = "https://github.com/nikhilrai-tech/seatbelt-for-AI-agents/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes"]

[project.scripts]
seatbelt = "seatbelt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
