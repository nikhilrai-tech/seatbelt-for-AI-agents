[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-seatbelt"
version = "0.1.0.dev0"
description = "A seatbelt for AI coding agents: understands the shell commands they run and blocks or asks before the dangerous ones."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nikhilrai-tech", email = "nikhilrai662@gmail.com" }]
keywords = ["ai-agents", "security", "guardrails", "devops", "claude-code", "shell"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes"]

[project.scripts]
seatbelt = "seatbelt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
